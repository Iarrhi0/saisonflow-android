name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run core regression tests
        run: bash tests/run-core-tests.sh
      - name: Check Android and compile debug APK
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Name the installable file
        run: cp app/build/outputs/apk/debug/app-debug.apk SaisonFlow.apk
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SaisonFlow-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Capture the installed home screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          script: |
            adb install SaisonFlow.apk
            adb shell am start -W -n com.saisonflow.app/.LibraryHome
            sleep 3
            adb shell dumpsys activity activities | grep -E 'mResumedActivity.*com.saisonflow.app'
            adb exec-out screencap -p > SaisonFlow-accueil.png
            python3 tests/emulator_offers.py
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.saisonflow.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -F "OK (1 test)" instrument.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SaisonFlow-accueil
          path: SaisonFlow-*.png
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SaisonFlow
          path: SaisonFlow.apk
          if-no-files-found: error
          retention-days: 14
